name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
      fail-fast: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libsodium-dev

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install curl libsodium

      - name: Install dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: C:\msys64\usr\bin\bash -lc "pacman -Sy --noconfirm --needed mingw-w64-x86_64-curl mingw-w64-x86_64-libsodium"
        shell: powershell

      - name: Configure
        run: |
          if [ "${{ matrix.os }}" = "windows-latest" ]; then
            export CC=C:/msys64/mingw64/bin/gcc.exe
            export CXX=C:/msys64/mingw64/bin/g++.exe
            export PATH=/c/msys64/mingw64/bin:$PATH
            cmake -B build -G Ninja -DBUILD_TESTS=ON -DLLAMA_CCACHE=OFF -DGGML_CCACHE=OFF -DCMAKE_BUILD_TYPE=Release
          else
            cmake -B build -G Ninja -DBUILD_TESTS=ON -DLLAMA_CCACHE=ON -DGGML_CCACHE=ON -DCMAKE_BUILD_TYPE=Release
          fi
        shell: bash
      
      - name: Build
        run: cmake --build build --config Release -j2
      
      - name: Test
        run: ctest --output-on-failure -C Release -j2
        working-directory: build